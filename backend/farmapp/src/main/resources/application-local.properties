spring.datasource.url=jdbc:h2:mem:farmdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.security.jwt.allow-default-secret=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.payment.stripe.public-key=${STRIPE_PUBLIC_KEY:}
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}
app.payment.stripe.success-url=${STRIPE_SUCCESS_URL:}
app.payment.stripe.cancel-url=${STRIPE_CANCEL_URL:}
