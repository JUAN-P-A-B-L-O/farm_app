spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.security.jwt.allow-default-secret=${APP_SECURITY_JWT_ALLOW_DEFAULT_SECRET:false}
app.security.jwt.expiration=86400000
app.auth.email-confirmation.frontend-base-url=${APP_FRONTEND_URL:${APP_AUTH_EMAIL_CONFIRMATION_FRONTEND_BASE_URL:http://localhost:5173}}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.auth.email-confirmation.token-expiration-hours=${APP_AUTH_EMAIL_CONFIRMATION_TOKEN_EXPIRATION_HOURS:24}
app.email.enabled=${APP_EMAIL_ENABLED:}
app.email.from=${APP_MAIL_FROM:${APP_EMAIL_FROM:no-reply@farmapp.local}}
app.email.confirmation.subject=${APP_EMAIL_CONFIRMATION_SUBJECT:Confirme sua conta no Farm App}
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME:${APP_EMAIL_SMTP_USERNAME:}}
spring.mail.password=${BREVO_SMTP_PASSWORD:${APP_EMAIL_SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${APP_EMAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${APP_EMAIL_SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${APP_EMAIL_SMTP_WRITE_TIMEOUT_MS:5000}

app.payment.stripe.public-key=${STRIPE_PUBLIC_KEY:}
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}
app.payment.stripe.success-url=${STRIPE_SUCCESS_URL:}
app.payment.stripe.cancel-url=${STRIPE_CANCEL_URL:}
