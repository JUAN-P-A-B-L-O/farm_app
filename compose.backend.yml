name: farm-app-backend

services:
  postgres:
    build: ./backend/postgres
    environment:
      POSTGRES_DB: farmdb
      POSTGRES_USER: farmapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmapp-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend/farmapp
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farmdb
      SPRING_DATASOURCE_USERNAME: farmapp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-farmapp-local}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-farm-app-docker-local-only-secret-change-before-deployment-2026}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@farmapp.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@farmapp.local}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  web:
    name: farm-app-web
