name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/farmapp/pom.xml

      - name: Run tests
        working-directory: backend/farmapp
        run: ./mvnw clean test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/farmapp
          push: true
          tags: |
            juanpabloid/farmapp:backend-latest
            juanpabloid/farmapp:backend-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/applications/farm_app

            docker compose -f compose.backend.yml pull backend

            docker compose -f compose.backend.yml \
              up -d --no-deps backend

            CONTAINER=$(docker compose -f compose.backend.yml ps -q backend)

            echo "Waiting for backend healthcheck..."

            for i in $(seq 1 60); do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                "$CONTAINER" 2>/dev/null || true)

              echo "Health: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$i" = "60" ]; then
                docker compose -f compose.backend.yml logs \
                  --tail=150 backend
                exit 1
              fi

              sleep 5
            done

            curl --fail --silent \
              http://127.0.0.1:18081/v3/api-docs \
              > /dev/null

            curl --fail --silent \
              https://api.farm.jpcore.app/v3/api-docs \
              > /dev/null

            echo "Deploy successful"
